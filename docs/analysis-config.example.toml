# Example analysis configuration for ufw-report.
#
# Load it explicitly:
#
#   ufw-report --config docs/analysis-config.example.toml
#
# Every section and key is optional. Values omitted here keep their built-in
# defaults, so this file can also serve as a reference.

[limits]
# Maximum decompressed size for one .gz input, in bytes (default: 4 GiB).
# Override per run with --max-decompressed-bytes.
max_decompressed_bytes = 4294967296

[thresholds]
# Distinct destination ports from one source in one window.
scan_ports_per_hour = 10
# Distinct destination hosts from one source in one window.
scan_hosts_per_hour = 10
# Administrative-port attempts from one source in one window.
bruteforce_attempts_per_hour = 20
# Administrative-port attempts from one source in one day.
bruteforce_attempts_per_day = 50
# Distinct sources against the same host and port in one window.
distributed_sources_per_hour = 20
# Minimum active days for a persistent-source finding.
persistence_min_days = 3
# Minimum blocked attempts for a persistent-source finding.
persistence_min_blocks = 20
# Minimum distinct sources for a network group to be reported.
subnet_min_sources = 5
# Profiles below this 0-100 score are left out of the ranking.
min_score = 25
# Sliding-window width per detector, in minutes (default: 60).
scan_window_minutes = 60
bruteforce_window_minutes = 60
distributed_window_minutes = 60

[integrity]
# Promote coverage anomalies to evidence-integrity findings.
# A value of 0 disables that check.
missing_hours = 24
out_of_order_lines = 10
future_entries = 1

[subnets]
ipv4_prefix = 24
ipv6_prefix = 64

[ports]
admin = [
  21, 22, 23, 25, 53, 110, 143, 389, 445, 1433, 3306, 3389, 5432, 5900,
  6379, 8080, 8443, 9200, 11211, 27017,
]

[allowlist]
# CIDRs excluded from findings and risk scores. Raw data and coverage still
# include them.
cidrs = ["192.0.2.0/24", "2001:db8::/32"]

[scoring]
volume_weight = 8
ports_weight = 2
admin_weight = 1
persistence_weight = 3
finding_weight = 10
