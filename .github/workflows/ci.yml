name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "ufw-report-cache"

      - name: Check formatting (fmt)
        run: cargo fmt --all -- --check

      - name: Strict analysis (Clippy + Pedantic)
        run: cargo clippy --all-targets --all-features -- -W clippy::pedantic -D warnings

      - name: Build project
        run: cargo build --verbose --locked

      - name: Build release binary (locked)
        run: cargo build --release --verbose --locked

      - name: Run tests
        run: cargo test --verbose --locked
