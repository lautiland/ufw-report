[package]
name = "ufw-report"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "CLI tool that reads UFW logs, analyzes blocked traffic, and shows an interactive TUI report"
repository = "https://github.com/lautiland/ufw-report"
homepage = "https://github.com/lautiland/ufw-report"
readme = "README.md"
keywords = ["ufw", "firewall", "logs", "tui", "security"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
